name: teste-resilience-patterns
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Consul + bancos
        run: |
          docker run -d --name consul --network host hashicorp/consul:1.20 agent -dev -client 0.0.0.0
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "create database db_product"
          psql -h localhost -U postgres -c "create database db_currency"
          sleep 5
          python3 - <<'PY'
          import shlex, urllib.request
          for line in open('start_consul.bat', encoding='utf-8'):
              if line.startswith('consul kv put'):
                  _,_,_,k,v = shlex.split(line.strip())
                  req = urllib.request.Request('http://localhost:8500/v1/kv/'+k, data=v.encode(), method='PUT')
                  urllib.request.urlopen(req).read()
          PY
      - name: Build
        run: |
          (cd currency-api && mvn -B -ntp -q package -DskipTests)
          (cd product-api && mvn -B -ntp -q package -DskipTests)
      - name: Testes
        run: |
          set -eu
          ok() { echo "  OK - $1"; }
          p() { curl -s "localhost:8000/products/1?targetCurrency=$1" | tee p.json | jq -c '{brand, convertedPrice, environment}'; }
          calls() { grep -c "Chamando currency-api: USD -> $1" product.log || true; }
          nohup java -jar currency-api/target/*.jar > currency.log 2>&1 &
          echo $! > currency.pid
          nohup java -jar product-api/target/*.jar > product.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8100/actuator/health >/dev/null && curl -sf localhost:8000/actuator/health >/dev/null && break; sleep 2; done
          sleep 10
          echo "== 1. Conversao normal via Consul (product-api -> currency-api)"
          p BRL; jq -e '.brand == "Apple" and .convertedPrice > 0' p.json; ok "conversao funcionando e campos na ordem certa"
          echo "== 2. Cache"
          p BRL >/dev/null; test "$(calls BRL)" = 1; ok "segunda chamada veio do cache"
          echo "== 3. Cotacao inexistente (404) nao dispara retry nem circuit breaker"
          for i in 1 2 3; do p XYZ >/dev/null; jq -e '.convertedPrice == -1' p.json >/dev/null; done
          test "$(calls XYZ)" = 3; ok "3 requisicoes = 3 chamadas"
          jq -e '.circuitBreakers["currency-api"].state == "CLOSED"' <(curl -s localhost:8000/actuator/circuitbreakers); ok "circuito CLOSED"
          echo "== 4. Fallback + Retry: currency-api fora do ar"
          kill $(cat currency.pid); sleep 3
          p EUR; jq -e '.convertedPrice == -1' p.json; test "$(calls EUR)" = 3; ok "fallback -1 apos 3 tentativas"
          echo "== 5. Circuit Breaker"
          p GBP >/dev/null
          curl -s localhost:8000/actuator/circuitbreakers | tee cb.json | jq -c '.circuitBreakers["currency-api"].state'
          jq -e '.circuitBreakers["currency-api"].state == "OPEN"' cb.json; ok "circuito OPEN"
          p MXN; test "$(calls MXN)" = 0; grep -q OPEN p.json; ok "com circuito aberto nao chama o currency-api"
          echo "== 6. Cache responde com o currency-api fora"
          p BRL; jq -e '.convertedPrice > 0' p.json; ok "BRL veio do cache"
          echo "TODOS OS TESTES PASSARAM"
      - name: Logs
        if: always()
        run: grep -E 'Chamando currency-api|ERROR' product.log | tail -30
