spring.application.name=product-api
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost/db_product
spring.datasource.username=postgres
spring.datasource.password=postgres

app.promotion.message=Chirstmas Promotion

#spring.profiles.actives=es

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:

# Desativa o cache de instancias do LoadBalancer (evita conflito com o CacheManager
# do Caffeine e faz o product-api perceber logo quando o currency-api cai/volta)
spring.cloud.loadbalancer.cache.enabled=false
